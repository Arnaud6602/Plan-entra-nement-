<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapis Tracker - Calendrier Mensuel</title>
    <style>
        :root {
            --primary: #2563eb; --secondary: #3b82f6; --success: #10b981;
            --dark: #0f172a; --card: #1e293b; --text: #f8fafc;
        }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; }
        .app-container { max-width: 550px; margin: auto; }
        
        .section { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; font-size: 1.4rem; color: var(--success); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-top: 0; color: var(--success); display: flex; justify-content: space-between; align-items: center; }

        .weight-cfg { text-align: center; margin-bottom: 15px; font-size: 0.9rem; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; }
        input[type=number] { background: #334155; border: 1px solid #475569; color: var(--success); padding: 5px; border-radius: 8px; width: 60px; text-align: center; font-weight: bold; }

        .days-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .day-btn { background: #334155; border: none; color: white; padding: 12px 16px; border-radius: 12px; cursor: pointer; min-width: 75px; transition: 0.3s; }
        .day-btn.active { background: var(--primary); font-weight: bold; transform: scale(1.05); }

        .info-box { font-size: 0.9rem; background: rgba(37, 99, 235, 0.1); padding: 15px; border-radius: 14px; margin-bottom: 20px; border-left: 4px solid var(--primary); line-height: 1.4; }

        .control { margin-bottom: 15px; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .val-display { color: white; font-weight: bold; }
        
        input[type=range] { width: 100%; height: 6px; border-radius: 5px; background: #475569; appearance: none; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; background: var(--success); border-radius: 50%; border: 3px solid #1e293b; }

        .result-box { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 20px; border-radius: 18px; text-align: center; margin-top: 10px; }
        .kcal-val { font-size: 3rem; font-weight: 800; display: block; line-height: 1; }
        
        .btn-validate { width: 100%; background: var(--success); border: none; color: white; padding: 16px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 12px; transition: 0.2s; }
        .btn-validate:active { transform: scale(0.96); opacity: 0.8; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; text-align: center; }
        .stat-card { background: #334155; padding: 12px; border-radius: 15px; }
        .stat-card span { display: block; font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }
        .stat-card b { font-size: 0.9rem; color: var(--success); }

        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 5px; }
        .cal-nav-btn { background: #334155; border: none; color: white; padding: 5px 15px; border-radius: 8px; cursor: pointer; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .weekday-label { text-align: center; font-size: 0.7rem; color: #94a3b8; font-weight: bold; padding-bottom: 5px; }
        .cal-day { aspect-ratio: 1; background: #1e293b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .cal-day.empty { background: transparent; border: none; cursor: default; }
        .cal-day.has-data { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
        .cal-day b { font-size: 0.7rem; margin-top: 2px; }
        .cal-day.today { border: 2px solid var(--primary); }

        .btn-clear { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>MON COACH TAPIS</h1>

    <div class="section">
        <div class="weight-cfg"><label>Poids :</label> <input type="number" id="weight" value="80" oninput="calculate()"> kg</div>
        <div class="days-nav" id="daysNav"></div>
        <div class="info-box" id="advice">Sélectionnez un jour.</div>

        <div class="control">
            <div class="label-row"><span>Durée</span><span class="val-display" id="tDisplay">30 min</span></div>
            <input type="range" id="time" min="5" max="120" step="5" value="30" oninput="calculate()">
        </div>
        <div class="control">
            <div class="label-row"><span>Vitesse</span><span class="val-display" id="sDisplay">5.0 km/h</span></div>
            <input type="range" id="speed" min="1" max="15" step="0.1" value="5" oninput="calculate()">
        </div>
        <div class="control">
            <div class="label-row"><span>Inclinaison</span><span class="val-display" id="inclVal">0 %</span></div>
            <input type="range" id="incl" min="0" max="15" step="1" value="0" oninput="calculate()">
        </div>

        <div class="result-box">
            <span style="font-size: 0.8rem; text-transform: uppercase;">Séance actuelle</span>
            <span class="kcal-val" id="kcalResult">0</span>
        </div>
        <button class="btn-validate" onclick="saveSession()">VALIDER & ENREGISTRER</button>
    </div>

    <div class="section">
        <h2>BILAN <button class="btn-clear" onclick="clearData()">RAZ</button></h2>
        <div class="stats-grid">
            <div class="stat-card"><span>Semaine</span><b id="weekTotal">0</b></div>
            <div class="stat-card"><span>Mois</span><b id="monthTotal">0</b></div>
            <div class="stat-card"><span>Année</span><b id="yearTotal">0</b></div>
        </div>

        <div class="cal-header">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">&#10094;</button>
            <b id="currentMonthYear">Mars 2026</b>
            <button class="cal-nav-btn" onclick="changeMonth(1)">&#10095;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>

<script>
    const daysArr = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
    const dayDataDefaults = {
        "Lun": { t: 45, s: 6.0, i: 0, desc: "🎯 <b>Endurance :</b> Course lente." },
        "Mar": { t: 40, s: 7.2, i: 1, desc: "🎯 <b>Fractionné :</b> 1min rapide / 1min lente." },
        "Mer": { t: 40, s: 4.8, i: 10, desc: "🎯 <b>Ventre Plat :</b> Marche inclinée forte." },
        "Jeu": { t: 30, s: 5.0, i: 0, desc: "🎯 <b>Récupération :</b> Marche tranquille." },
        "Ven": { t: 50, s: 6.2, i: 1, desc: "🎯 <b>Endurance Longue :</b> Brûlage stable." },
        "Sam": { t: 0, s: 0, i: 0, desc: "🎯 <b>Repos.</b>" },
        "Dim": { t: 60, s: 5.2, i: 7, desc: "🎯 <b>Rando Tapis :</b> Sortie longue inclinée." }
    };

    let history = JSON.parse(localStorage.getItem('tapisHistory')) || {};
    let viewDate = new Date();

    function init() {
        const nav = document.getElementById('daysNav');
        daysArr.forEach(d => {
            const btn = document.createElement('button');
            btn.className = 'day-btn';
            btn.innerText = d;
            btn.onclick = () => loadDay(d, btn);
            nav.appendChild(btn);
        });
        renderCalendar();
        updateStats(new Date());
        
        const dayNames = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
        const todayName = dayNames[new Date().getDay()];
        const targetBtn = Array.from(document.querySelectorAll('.day-btn')).find(b => b.innerText === todayName) || document.querySelectorAll('.day-btn')[0];
        targetBtn.click();
    }

    function loadDay(day, btn) {
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const d = dayDataDefaults[day];
        document.getElementById('time').value = d.t;
        document.getElementById('speed').value = d.s;
        document.getElementById('incl').value = d.i;
        document.getElementById('advice').innerHTML = d.desc;
        calculate();
    }

    function calculate() {
        const w = parseFloat(document.getElementById('weight').value);
        const t = parseFloat(document.getElementById('time').value);
        const s = parseFloat(document.getElementById('speed').value);
        const i = parseFloat(document.getElementById('incl').value);
        document.getElementById('tDisplay').innerText = t + " min";
        document.getElementById('sDisplay').innerText = s.toFixed(1) + " km/h";
        document.getElementById('inclVal').innerText = i + " %";
        if (s <= 0) { document.getElementById('kcalResult').innerText = "0"; return; }
        let met = (s <= 8) ? (3.5 + (0.1 * s * 16.6) + (1.8 * s * 16.6 * i/100)) / 3.5 
                           : (3.5 + (0.2 * s * 16.6) + (0.9 * s * 16.6 * i/100)) / 3.5;
        let kcal = Math.round(met * 3.5 * w / 200 * t);
        document.getElementById('kcalResult').innerText = kcal;
    }

    function saveSession() {
        const kcal = parseInt(document.getElementById('kcalResult').innerText);
        if (kcal <= 0) return;
        
        // CORRECTION DATE LOCALE
        const iso = new Date().toLocaleDateString('en-CA'); 
        
        history[iso] = (history[iso] || 0) + kcal;
        saveAndRefresh(new Date());
        alert("Séance enregistrée ! 🔥");
    }

    function changeMonth(offset) {
        viewDate.setMonth(viewDate.getMonth() + offset);
        renderCalendar();
        updateStats(viewDate);
    }

    function saveAndRefresh(refDate) {
        localStorage.setItem('tapisHistory', JSON.stringify(history));
        renderCalendar();
        updateStats(refDate);
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = "";
        const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        document.getElementById('currentMonthYear').innerText = `${monthNames[viewDate.getMonth()]} ${viewDate.getFullYear()}`;

        daysArr.forEach(d => grid.innerHTML += `<div class="weekday-label">${d}</div>`);

        const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
        let startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for (let i = 0; i < startDay; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
            const iso = dateObj.toLocaleDateString('en-CA');
            const hasKcal = history[iso];
            const isToday = iso === new Date().toLocaleDateString('en-CA');
            
            const dayEl = document.createElement('div');
            dayEl.className = `cal-day ${hasKcal ? 'has-data' : ''} ${isToday ? 'today' : ''}`;
            dayEl.innerHTML = `<span>${d}</span><b>${hasKcal || ''}</b>`;
            dayEl.onclick = () => {
                const current = history[iso] || 0;
                const newVal = prompt(`Kcal pour le ${d}/${viewDate.getMonth()+1} :`, current);
                if (newVal !== null) {
                    if (parseInt(newVal) <= 0) delete history[iso];
                    else history[iso] = parseInt(newVal);
                    saveAndRefresh(dateObj);
                }
            };
            grid.appendChild(dayEl);
        }
    }

    function updateStats(refDate) {
        let wTotal = 0, mTotal = 0, yTotal = 0;
        const refMonth = refDate.getMonth();
        const refYear = refDate.getFullYear();
        
        const d = new Date(refDate);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff)).toLocaleDateString('en-CA');
        const sundayDate = new Date(new Date(monday));
        sundayDate.setDate(sundayDate.getDate() + 6);
        const sunday = sundayDate.toLocaleDateString('en-CA');

        Object.keys(history).forEach(iso => {
            const val = history[iso];
            const date = new Date(iso);
            if (date.getFullYear() === new Date().getFullYear()) yTotal += val;
            if (date.getMonth() === refMonth && date.getFullYear() === refYear) mTotal += val;
            if (iso >= monday && iso <= sunday) wTotal += val;
        });

        document.getElementById('weekTotal').innerText = wTotal + " kcal";
        document.getElementById('monthTotal').innerText = mTotal + " kcal";
        document.getElementById('yearTotal').innerText = yTotal + " kcal";
    }

    function clearData() { if(confirm("Effacer tout ?")) { history = {}; saveAndRefresh(new Date()); } }

    init();
</script>
</body>
</html>
